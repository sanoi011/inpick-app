name: Build SAM 2.1 Docker Image

# 트리거:
#  - runpod_serverless/ 디렉토리 변경 시 자동
#  - GitHub Actions 페이지에서 'Run workflow' 수동 실행
on:
  push:
    branches: [main]
    paths:
      - 'runpod_serverless/**'
      - '.github/workflows/sam-docker.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: '태그 (기본: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  # github.repository_owner = 'sanoi011', repository name = 'inpick-app'
  # → 최종 이미지: ghcr.io/sanoi011/inpick-sam2
  IMAGE_NAME: ${{ github.repository_owner }}/inpick-sam2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write   # GHCR push 권한 — secret 등록 불필요, GITHUB_TOKEN 자동 사용

    steps:
      # GitHub free runner 디스크 14GB 한도 — SAM 2.1 이미지 ~10GB. 사전에 ~30GB 확보.
      - name: Free disk space (runner는 14GB만 → ~30GB 확보)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata + tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short

      - name: Build & push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./runpod_serverless
          file: ./runpod_serverless/Dockerfile
          platforms: linux/amd64   # RunPod GPU 워커는 모두 amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache로 재빌드 시간 단축 (첫 빌드 ~25분 → 이후 ~5분)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image URL 출력 (RunPod 콘솔 입력값)
        run: |
          echo "::notice title=RunPod Container Image::Use this URL when creating Serverless Endpoint:"
          echo "::notice::ghcr.io/${{ github.repository_owner }}/inpick-sam2:latest"
